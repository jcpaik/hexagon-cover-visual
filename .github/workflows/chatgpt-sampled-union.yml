name: Temporary sampled-union final verification
on:
  push:
    branches: [chatgpt/sampled-trace-exact-unions-20260913140437]
    paths: [.github/workflows/chatgpt-sampled-union.yml]
permissions:
  contents: read
jobs:
  verify-final-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: chatgpt/sampled-trace-exact-unions-20260913140437
          fetch-depth: 0
          persist-credentials: false
      - name: Identify and verify the checked-out source
        run: |
          echo TESTED_COMMIT=$(git rev-parse HEAD)
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          expected = {
            'docs/STRATEGY3.md':'7c392b2402baecc953d4a75d89787e969c7cdd5db352f19a8864b5aecd373b4e',
            'package.json':'63a36cbacb667b4e27a46d88b851a8223eb6c0da24b9b2cfcab9657d7eab7dbd',
            'scripts/verify-sampled-render.mjs':'a5d9bec2df425c7c8795f98247a78d8326146f6d1e5a1b082308ff8a33aea9eb',
            'src/ab-union/render.ts':'ea09598b33f9cc4485710ede49b4d399f6c098f6f0e049f728f617bd212236c9',
            'src/ab-union/sampledMask.ts':'6d42514433e381ce4b5db856ea4b4f4897b68616389af1422a574290237dc1d8',
            'src/modes/strategy3/controller.ts':'e8d1bb5c951b23ff3c9ea33199556a13cd3244194c62715ab00488cf81934392',
            'src/strategy3/gapTraces.ts':'1f27fdad70b05220bae1fddc45b66f766b89882fe43d3e28c06a686147f9991c'
          }
          for path, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == digest, path
              assert subprocess.check_output(['git','ls-tree','HEAD',path],text=True).startswith('100644 '), path
          temporary = {'.github/workflows/chatgpt-sampled-union.yml', '.github/sampled-union-delivery.json'}
          present = {path for path in temporary if pathlib.Path(path).exists()}
          changed = set(subprocess.check_output(['git','diff','--name-only','d188d6973681535b22632f38ef575989af4d6cdc','HEAD'],text=True).splitlines())
          assert changed == set(expected) | present, changed
          print('TEMPORARY_PATHS_PRESENT=' + json.dumps(sorted(present)))
          print(json.dumps(expected,indent=2))
          pathlib.Path('/tmp/final-source').mkdir(exist_ok=True)
          pathlib.Path('/tmp/final-source/file_manifest.json').write_text(json.dumps(expected,indent=2)+'\n')
          PY
      - name: Full regression suite and production build
        run: |
          npm ci
          npm run verify
          npm run build
          git diff --exit-code
          git diff --check d188d6973681535b22632f38ef575989af4d6cdc HEAD
          git rev-parse HEAD > /tmp/final-source/tested_commit.txt
          git archive --format=tar HEAD > /tmp/final-source/source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-source-${{ github.run_attempt }}
          path: /tmp/final-source
          retention-days: 3
          if-no-files-found: error
