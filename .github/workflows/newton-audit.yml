name: Newton witness audit
on:
  push:
    branches: [chatgpt/newton-inner-points-20260911150312]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - name: Build and regression checks
        run: |
          npm run build
          npm run verify
          git diff --check
      - name: Export audited checkout for offline editing
        if: always()
        run: tar -czf /tmp/newton-audit-checkout.tar.gz --exclude=.git --exclude=dist .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: newton-audit-checkout
          path: /tmp/newton-audit-checkout.tar.gz
          retention-days: 1
